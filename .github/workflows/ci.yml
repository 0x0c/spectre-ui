name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_vrt:
        description: 'VRT のゴールデン画像を記録し直す (SU-0015)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 適合性コーパスとランタイムのテスト。Android SDK を必要としないので
  # ここが一番速く回り、仕様違反を最初に捕まえる層になる。
  core:
    name: Core (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: spectre-core のテスト
        working-directory: clients/android
        run: ./gradlew --no-daemon :spectre-core:test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: clients/android/spectre-core/build/reports/tests/test
          retention-days: 7

  # マニフェストと生成物がずれていないこと (ADR-0002)。
  # 生成物はコミットする方針なので、再生成して差分が出たら失敗させる。
  codegen:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 加算のみチェック (下) が比較元の版を `git show` で読むために全履歴が要る。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Unit tests for the additive-evolution diagnostic itself. The step further down only
      # ever runs it against the real diff, so on a change that violates nothing there is no
      # way to tell whether the diagnostic would have missed a violation.
      - name: codegen unit tests
        run: node --test packages/codegen/test/*.test.mjs

      - name: 生成物がマニフェストと同期しているか
        run: node packages/codegen/generate.mjs --check

      - name: 仕様 JSON の構文チェック
        run: |
          set -euo pipefail
          find spec examples -name '*.json' -print0 \
            | xargs -0 -I{} node -e 'JSON.parse(require("fs").readFileSync("{}","utf8"))'
          echo "すべての JSON が解析できました"

      # 仕様を変えるならコーパスへのケース追加を伴わなければならない (ADR-0008, SU-0007)。
      # 忘れた変更を機械的に検出する。
      - name: 仕様変更には適合性コーパスの拡張を伴う
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          spec_changed=$(echo "$changed" | grep -E '^docs/spec/|^spec/component-manifest\.json' || true)
          corpus_changed=$(echo "$changed" | grep -E '^spec/conformance/' || true)
          if [ -n "$spec_changed" ] && [ -z "$corpus_changed" ]; then
            echo "::error::仕様ファイルが変更されていますが spec/conformance/ の拡張がありません (ADR-0008)。"
            echo "変更された仕様ファイル:"
            echo "$spec_changed"
            exit 1
          fi
          echo "OK: 仕様変更なし、またはコーパスも同じ変更で拡張されています。"

      # schemaVersion のマイナー増加が加算のみであること (docs/compatibility.md §5, ADR-0006)。
      # origin/main と比較するため、上の fetch-depth: 0 で全履歴を取得しておく。
      - name: マニフェストの加算のみ進化規則
        run: node packages/codegen/check-additive-evolution.mjs

  # packages/core・packages/manifest・packages/server・packages/editor のテスト。実際の
  # PostgreSQL に対して統合テストを走らせる (SU-0004)。editor はここに同居させている —
  # 同じ pnpm ワークスペース・同じ Node セットアップを再利用でき、別ジョブに割る理由がないため。
  server:
    name: TypeScript (core / manifest / server / editor)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectre
          POSTGRES_PASSWORD: spectre
          POSTGRES_DB: spectre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # バージョンは指定しない — ルート package.json の packageManager フィールドから
      # 読む。両方指定すると ERR_PNPM_BAD_PM_VERSION を避けるためこのアクション自体が
      # エラーで止まる。
      - uses: pnpm/action-setup@v4

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: packages/core の型検査とテスト (適合性コーパス expr/ を含む)
        run: |
          pnpm --filter @spectre-ui/core run typecheck
          pnpm --filter @spectre-ui/core run test

      - name: packages/manifest の型検査とテスト
        run: |
          pnpm --filter @spectre-ui/manifest run typecheck
          pnpm --filter @spectre-ui/manifest run test

      - name: packages/server の型検査とテスト
        working-directory: packages/server
        env:
          TEST_DATABASE_URL: postgres://spectre:spectre@localhost:5432/spectre_test
        run: |
          pnpm run typecheck
          pnpm run test

      - name: packages/editor の型検査・テスト・ビルド
        working-directory: packages/editor
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build

  # Compose レンダラとサンプルアプリのコンパイル。
  # GitHub の ubuntu ランナーには Android SDK が入っているため、
  # settings.gradle.kts の条件付き include が :spectre-ui と :sample を拾う。
  android:
    name: Android (Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Android モジュールが構成に含まれることを確認
        working-directory: clients/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon projects | tee /tmp/projects.txt
          grep -q "spectre-ui" /tmp/projects.txt \
            || { echo "::error::Android SDK が検出されず :spectre-ui がスキップされました"; exit 1; }

      - name: ライブラリとサンプルのビルド
        working-directory: clients/android
        run: ./gradlew --no-daemon :spectre-ui:assembleDebug :sample:assembleDebug

      # Unit tests on the renderer side. They cover only property extraction and the token maps,
      # neither of which builds a Compose tree, so they run on the JVM with no emulator. The
      # assembleDebug step above only checks that it compiles, making this the sole check on
      # that layer.
      - name: spectre-ui tests
        working-directory: clients/android
        run: ./gradlew --no-daemon :spectre-ui:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectre-ui-test-report
          path: clients/android/spectre-ui/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sample-debug-apk
          path: clients/android/sample/build/outputs/apk/debug/*.apk
          retention-days: 7

  # Compose レンダラのビジュアルリグレッションテスト (SU-0015)。
  # Roborazzi が Robolectric 上で描画するので、エミュレータを起動せず
  # android ジョブと同じ ubuntu ランナーで回る。
  android-vrt:
    name: Android VRT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # ゴールデン画像がまだ1枚もない間は記録モードで走り、成果物として出す。
      # 比較対象がない状態での検証は、退行がなくても必ず落ちるため。
      - name: 実行モードの決定
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.record_vrt }}" = "true" ]; then
            echo "::notice::VRT を記録モードで実行します (workflow_dispatch の指定)。"
            echo "record=true" >> "$GITHUB_OUTPUT"
          elif ls clients/android/spectre-ui/src/test/snapshots/*.png >/dev/null 2>&1; then
            echo "record=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ゴールデン画像がないため記録モードで実行します。成果物 android-vrt-images を確認し、内容が正しければコミットしてください。"
            echo "record=true" >> "$GITHUB_OUTPUT"
          fi

      - name: VRT
        working-directory: clients/android
        env:
          RECORD: ${{ steps.mode.outputs.record }}
        run: |
          set -euo pipefail
          args=""
          if [ "$RECORD" = "true" ]; then args="-Pspectre.vrt.record=true"; fi
          ./gradlew --no-daemon :spectre-ui:testDebugUnitTest \
            --tests 'dev.spectre.ui.SpectreScreenSnapshotTest' $args

      # 記録した画像と、検証に失敗したときの差分画像の両方を出す。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-vrt-images
          path: |
            clients/android/spectre-ui/src/test/snapshots
            clients/android/spectre-ui/build/outputs/roborazzi
          retention-days: 7

  # SwiftUI レンダラのビジュアルリグレッションテスト (SU-0015)。
  # ios ジョブの swift test は macOS 上で走るため、iOS の描画は固定できない。
  # こちらは iOS シミュレータ上でテストを実行する。
  ios-vrt:
    name: iOS VRT
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 実行モードの決定
        id: mode
        run: |
          set -euo pipefail
          goldens='clients/ios/Tests/SpectreUISnapshotTests/__Snapshots__/SpectreScreenSnapshotTests'
          if [ "${{ github.event.inputs.record_vrt }}" = "true" ]; then
            echo "::notice::VRT を記録モードで実行します (workflow_dispatch の指定)。"
            echo "record=1" >> "$GITHUB_OUTPUT"
          elif ls "$goldens"/*.png >/dev/null 2>&1; then
            echo "record=0" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ゴールデン画像がないため記録モードで実行します。成果物 ios-vrt-images を確認し、内容が正しければコミットしてください。"
            echo "record=1" >> "$GITHUB_OUTPUT"
          fi

      # TEST_RUNNER_ 接頭辞つきの環境変数は、xcodebuild が接頭辞を外して
      # テストプロセスへ渡す。シミュレータ上のテストへ値を届ける経路はこれ。
      - name: VRT
        working-directory: clients/ios
        env:
          SPECTRE_VRT_RECORD: ${{ steps.mode.outputs.record }}
          TEST_RUNNER_SPECTRE_VRT_RECORD: ${{ steps.mode.outputs.record }}
        run: |
          set -uo pipefail
          # 既定のシェルは `bash -e` なので、xcodebuild の失敗をここで判定するには
          # -e を明示的に外す必要がある (`set -uo pipefail` では外れない)。
          set +e
          # ライブラリ製品と同名のスキームにはテストアクションがない。パッケージを
          # 開いたときに生成される集約スキーム (通常 `<名前>-Package`) だけが
          # テストターゲットを含むので、名前を決め打ちせず列挙して選ぶ。
          scheme=$(xcodebuild -list | tr -d ' \t' | grep -E -- '-Package$' | head -1)
          if [ -z "$scheme" ]; then
            echo "::error::テストアクションを持つスキームが見つかりません。存在するスキーム:"
            xcodebuild -list
            exit 1
          fi
          echo "使用するスキーム: $scheme"
          xcodebuild test \
            -scheme "$scheme" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:SpectreUISnapshotTests \
            -resultBundlePath vrt-result.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
          status=$?
          # 記録モードでは swift-snapshot-testing が意図的にテストを失敗させる
          # (記録したまま気付かず通過するのを防ぐため)。記録が目的の実行では、
          # 画像が実際に残ったかどうかで成否を判断する。
          if [ "$SPECTRE_VRT_RECORD" = "1" ]; then
            goldens='Tests/SpectreUISnapshotTests/__Snapshots__/SpectreScreenSnapshotTests'
            if ls "$goldens"/*.png >/dev/null 2>&1; then
              echo "::notice::ゴールデン画像を記録しました。成果物 ios-vrt-images から取得してコミットしてください。"
              exit 0
            fi
            echo "::error::記録モードで実行しましたが、ゴールデン画像が1枚も生成されていません。"
            exit 1
          fi
          exit $status

      # 画像だけを軽い成果物として出す。記録したゴールデンをコミットする人は
      # これだけを取れば済む。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-vrt-images
          path: clients/ios/Tests/SpectreUISnapshotTests/__Snapshots__
          retention-days: 7

      # 結果バンドルは数十MBあるので失敗時だけ。検証に失敗したときの実画像と差分は、
      # swift-snapshot-testing がここに添付として残す。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-vrt-result-bundle
          path: clients/ios/vrt-result.xcresult
          retention-days: 7

  # Unit tests for the Python scripts that assemble the docs site.
  #
  # Only pages.yml ever ran these, and no layer checked them. Their failures also take the shape
  # of "a page that built fine but says the wrong thing" — every item looking like the same
  # status because it was misread, a link pointing somewhere else — so a green deploy proves
  # nothing. They run on the standard library's unittest alone, so there is no dependency.
  docs-scripts:
    name: Docs scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: scripts/ unit tests
        run: python3 -m unittest discover -s scripts/tests -t . -v

      # pages.yml runs this too, but only for changes touching docs/** and friends (its path
      # filter). A missing counterpart appears exactly when a document is added, so check it
      # unconditionally here as well.
      - name: docs/ language pair completeness
        run: python3 scripts/check_docs_mirror.py

  # The SpectreCore conformance tests plus the SpectreUI unit tests. Once the former pass, the
  # Swift implementation is pinned to the same behavior as the Kotlin one within the corpus
  # (ADR-0008).
  ios:
    name: iOS (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode のバージョン
        run: |
          xcodebuild -version
          swift --version

      - name: SpectreCore / SpectreUI のビルド
        working-directory: clients/ios
        run: swift build

      # Runs both SpectreCoreTests (the conformance corpus) and SpectreUITests (property
      # extraction and the token maps). The latter is the counterpart to
      # :spectre-ui:testDebugUnitTest on the Compose side.
      - name: Conformance and unit tests
        working-directory: clients/ios
        run: swift test

      # SpectreUI の本来の対象は iOS。macOS でのビルドが通っても
      # iOS 固有 API の解決までは保証されないため、実機向けにも通す。
      - name: SpectreUI を iOS 向けにビルド
        working-directory: clients/ios
        run: |
          xcodebuild build \
            -scheme SpectreUI \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # サンプルアプリは XcodeGen でプロジェクトを生成してからビルドする。
  # .xcodeproj をコミットしない方針 (情報源は project.yml) の裏取りでもある。
  ios-sample:
    name: iOS sample app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen の導入
        run: brew install xcodegen

      - name: プロジェクト生成
        working-directory: clients/ios/SampleApp
        run: xcodegen generate

      - name: サンプルアプリのビルド
        working-directory: clients/ios/SampleApp
        run: |
          xcodebuild build \
            -project SpectreSample.xcodeproj \
            -scheme SpectreSample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # APNs サンプルアプリ (SU-0012)。ペイロード JSON の構文検証と、
  # ios-sample と同じ XcodeGen 経由のビルド検証を行う。
  ios-apns-sample:
    name: iOS APNs sample app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 例示ペイロードの構文チェック
        run: |
          set -euo pipefail
          find clients/ios/APNsSample/Payloads -name '*.apns' -print0 \
            | xargs -0 -I{} python3 -c "import json,sys; json.load(open(sys.argv[1]))" {}
          echo "すべてのペイロードが解析できました"

      - name: XcodeGen の導入
        run: brew install xcodegen

      - name: プロジェクト生成
        working-directory: clients/ios/APNsSample
        run: xcodegen generate

      - name: サンプルアプリのビルド
        working-directory: clients/ios/APNsSample
        run: |
          xcodebuild build \
            -project SpectreAPNsSample.xcodeproj \
            -scheme SpectreAPNsSample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
