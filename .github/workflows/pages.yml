name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "roadmaps/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "packages/editor/**"
      - "packages/manifest/**"
      - "spec/component-manifest.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "roadmaps/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "packages/editor/**"
      - "packages/manifest/**"
      - "spec/component-manifest.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイはキャンセルせず、キューに積んで順番に流す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # バージョンは指定しない — ルート package.json の packageManager フィールドから読む。
      - uses: pnpm/action-setup@v4

      - name: エディタの依存関係のインストール
        run: pnpm install --frozen-lockfile

      # packages/editor を静的ビルドし、docs サイトと同居させる (/editor/ 配下)。
      # 実行時のバックエンド依存はなく、サンプルドキュメントで完結するオフライン版。
      - name: エディタのビルド
        working-directory: packages/editor
        run: pnpm run build

      # リポジトリ設定で Pages が未設定でも、ここで有効化する (Source = GitHub Actions)
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # docs/ の英語・日本語ページが対で揃っているか（spec/ は既知の例外として除外）
      - name: Check docs/ language mirror completeness
        run: python3 scripts/check_docs_mirror.py

      # ドキュメント → site/docs/。--strict なのでリンク切れがあれば落ちる
      - name: Build documentation
        run: mkdocs build --strict

      # ロードマップ項目一覧 → site/index.html
      - name: Build roadmap index
        run: python3 scripts/build_roadmap_index.py site

      # エディタの静的ビルドを site/editor/ に配置 (vite.config.ts の base と対応)
      - name: エディタを site/editor/ に配置
        run: |
          mkdir -p site/editor
          cp -r packages/editor/dist/. site/editor/

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
